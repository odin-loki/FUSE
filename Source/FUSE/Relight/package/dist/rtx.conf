# FUSE Relight default configuration (rtx.conf), shipped with the package.
#
# Relight reads rtx.conf from the game's working directory (usually the folder of the game's .exe).
# Keys named rtx.* are the same keys RTX Remix uses, so an existing Remix rtx.conf keeps working; every
# rtx.* key also answers to its relight.* twin. Later files win: dxvk.conf, the per-game profile,
# rtx.conf (or the files listed in DXVK_RTX_CONFIG_FILE), <mod>/rtx.conf, then user.conf.
# Environment variables (FUSE_RELIGHT_*) override everything. See docs/relight.md for the full list.

# Capture the game's draws (textures, geometry, draw classification). Needed by every mode below.
relight.tap.mode = capture

# What FUSE renders at the injection point:
#   off          plain DXVK (Relight idle)
#   passthrough  the game's own image through FUSE's frame graph (diagnostics)
#   raster       remastered raster rendering of the captured scene (default)
#   pathtrace    path-traced rendering (needs a GPU with Vulkan ray tracing)
relight.frame.mode = raster

# Inject FUSE's image at the first UI draw (Remix behaviour), so the game's HUD stays on top.
relight.frame.injectAtUi = True

# Pre-transformed (XYZRHW) draws are treated as UI, as in Remix.
rtx.preTransformedVerticesIsUI = True

# Texture categories (hash lists) come from the in-game developer menu or a per-game profile, e.g.:
# rtx.uiTextures = 0x1234567890ABCDEF, 0x0FEDCBA987654321
# rtx.skyBoxTextures =
