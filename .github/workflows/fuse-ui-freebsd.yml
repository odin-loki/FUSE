name: FUSE UI (FreeBSD)

on:
  push:
    branches: [main, development]
    paths:
      - 'Source/FUSE/UI/**'
      - '.github/workflows/fuse-ui-freebsd.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'Source/FUSE/UI/**'
      - '.github/workflows/fuse-ui-freebsd.yml'
  workflow_dispatch:

concurrency:
  # head_ref is PR-only; on push use ref so main runs share a group but are not cancelled (see cancel-in-progress).
  group: ci-${{ github.actor }}-${{ github.head_ref || github.ref }}-${{ github.ref }}-fuse-ui-freebsd
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuse-ui-freebsd:
    name: FUSE UI FreeBSD 14 x86_64 (base clang / libc++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # FUSE UI standalone in a FreeBSD VM: fuse_text, fuse_ui_*, fuse_app + the X11 backend (App/src/native.cpp,
      # libX11 is loaded at run time so no X packages are needed to build). vulkan-headers / vulkan-loader make
      # fuse_ui_vk and the Xlib swapchain presenter (App/src/vk_present.cpp) compile; the VM has no Vulkan device
      # and no display, so only the headless gates run (-LE vulkan; the GPU parity gate skips with 77).
      - name: Build and test FUSE UI on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          prepare: |
            pkg install -y cmake ninja vulkan-headers vulkan-loader
          run: |
            set -e
            freebsd-version
            c++ --version
            cmake -S Source/FUSE/UI -B build-ui-freebsd -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build-ui-freebsd
            ctest --test-dir build-ui-freebsd -LE vulkan --output-on-failure
