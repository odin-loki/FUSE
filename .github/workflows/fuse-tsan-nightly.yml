name: FUSE fuse_core (TSan nightly)

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keep apt lists in sync with docs/building.md and fuse-umbrella-linux.yml.
env:
  FUSE_APT_LINUX_BASE: ninja-build cmake g++-13

jobs:
  fuse-core-tsan:
    name: fuse_core tests (ThreadSanitizer)
    # ubuntu-latest -> 26.04; stay on 24.04 for parity with the umbrella Linux gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }}

      - name: Configure fuse_core tests with TSan
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_CORE_ENABLE_TSAN=ON \
            -DFUSE_BUILD_SMOKE=OFF \
            -DFUSE_BUILD_HYBRID_DEMO=OFF \
            -DFUSE_BUILD_PROJECT=OFF \
            -DFUSE_BUILD_PARITY_DEMOS=OFF \
            -DFUSE_BUILD_TOOLS=OFF \
            -DFUSE_BUILD_EDITOR_API=OFF \
            -DFUSE_BUILD_MODULES=OFF \
            -DFUSE_BUILD_AUDIO=OFF \
            -DFUSE_BUILD_SCRIPT=OFF \
            -DFUSE_BUILD_VULKAN=OFF \
            -DFUSE_BUILD_CUDA=OFF

      - name: Build fuse_core test targets
        run: |
          # Every executable under Source/FUSE/Core/tests (ctest -L tsan below).
          cmake --build build-tsan --target Source/FUSE/Core/tests/all
          # UNI-U7-ASSET-1: runtime asset core (MPSC render-upload queue, AssetRegistry job pipeline).
          cmake --build build-tsan --target Source/FUSE/Asset/tests/all

      - name: Run TSan CTest (fuse_core + asset runtime)
        run: ctest --test-dir build-tsan -L tsan --output-on-failure --timeout 2400
