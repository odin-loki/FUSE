name: FUSE Umbrella (Linux)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  # One umbrella workflow per ref; cancel superseded pushes so the host slot is not held by an old SHA.
  group: ci-${{ github.actor }}-${{ github.head_ref || github.ref }}-fuse-linux
  cancel-in-progress: true

# Keep apt lists in sync with docs/building.md (Linux system packages).
env:
  FUSE_APT_LINUX_BASE: ninja-build cmake g++-13
  FUSE_APT_LINUX_VULKAN: libvulkan-dev mesa-vulkan-drivers vulkan-tools vulkan-validationlayers glslang-tools spirv-tools
  FUSE_APT_LINUX_WORLDEXTRACT: python3-pip python3-venv libegl1
  # FUSE UI editor shell under Xvfb: fuse_app_native dlopens libX11 / libXrandr / libXcursor / libxkbcommon / libdbus-1
  # at run time (no X11 headers at build time); dbus provides dbus-run-session for the a11y_linux gate.
  FUSE_APT_LINUX_UI_EDITOR: xvfb xauth libx11-6 libxrandr2 libxcursor1 libxkbcommon0 libdbus-1-3 dbus
  # Lavapipe ICD + Khronos validation manifests (apt vulkan-validationlayers).
  FUSE_LINUX_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.json
  FUSE_LINUX_VK_LAYER_MANIFEST_DIR: /usr/share/vulkan/explicit_layer.d

jobs:
  fuse-core-linux:
    name: fuse_core + tests + smoke
    # One heavy ubuntu-24.04 job at a time so push bursts (relight/cuda/windows-cross) do not starve matrix legs.
    concurrency:
      group: fuse-umbrella-linux-host-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    # ubuntu-latest -> 26.04 (Oct 2026); stay on 24.04 for Lavapipe/editor gates parity with docs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }} ${{ env.FUSE_APT_LINUX_VULKAN }} ${{ env.FUSE_APT_LINUX_WORLDEXTRACT }}

      - name: WorldExtract python deps (fuse_world_extract_synthetic)
        run: |
          python3 -m pip install --user -r Tools/FUSE/WorldExtract/requirements.txt

      - name: Configure umbrella (core + legacy + smoke + U7/U8)
        run: |
          cmake -B build-fuse -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_BUILD_SMOKE=ON \
            -DFUSE_BUILD_HYBRID_DEMO=ON \
            -DFUSE_BUILD_PROJECT=ON \
            -DFUSE_BUILD_PARITY_DEMOS=ON \
            -DFUSE_BUILD_TOOLS=ON \
            -DFUSE_BUILD_EDITOR_API=ON \
            -DFUSE_BUILD_EDITOR=OFF \
            -DFUSE_BUILD_VULKAN=ON \
            -DFUSE_BUILD_CUDA=ON
      - name: Build
        run: cmake --build build-fuse --config Release

      - name: Run CTest
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
          # VK_ADD_LAYER_PATH only: VK_LAYER_PATH would hide FUSE test layers under build-fuse/.
          VK_ADD_LAYER_PATH: ${{ env.FUSE_LINUX_VK_LAYER_MANIFEST_DIR }}
        run: ctest --test-dir build-fuse --no-tests=error --output-on-failure --timeout 2400

      - name: Run demo_hybrid_hud
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
        run: ./build-fuse/Source/FUSE/Apps/HybridHud/demo_hybrid_hud

      - name: Run U8 parity demos
        run: |
          ./build-fuse/Source/FUSE/Apps/Demo3DEmpty/demo_3d_empty Samples/unification/demo_3d_empty
          ./build-fuse/Source/FUSE/Apps/Demo2DSprites/demo_2d_sprites Samples/unification/demo_2d_sprites
          ./build-fuse/Source/FUSE/Apps/DemoAiBt/demo_ai_bt Samples/unification/demo_ai_bt
          ./build-fuse/Source/FUSE/Apps/DemoTimeline/demo_timeline Samples/unification/demo_timeline
          ./build-fuse/Source/FUSE/Apps/DemoFx/demo_fx Samples/unification/demo_fx
          ./build-fuse/Source/FUSE/Apps/DemoAdventureStub/demo_adventure_stub Samples/unification/demo_adventure_stub

      - name: Run fuse_import dry-run
        run: |
          ./build-fuse/Tools/FUSE/fuse_import --project Samples/unification/demo_3d_empty
          ./build-fuse/Tools/FUSE/fuse_import --source Templates/BaseGame/game/data/ExampleModule/levels/ExampleLevel.mis

      - name: Run fuse_cook dry-run
        run: |
          ./build-fuse/Tools/FUSE/fuse_cook --project Samples/unification/demo_3d_empty --dry-run

  fuse-u8-present:
    name: U8 demo swapchain present (xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }} ${{ env.FUSE_APT_LINUX_VULKAN }} xvfb xauth libx11-dev libxi-dev

      - name: Configure (parity demos + X11 display wrapper)
        run: |
          cmake -B build-u8-present -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_BUILD_HYBRID_DEMO=ON \
            -DFUSE_BUILD_PROJECT=ON \
            -DFUSE_BUILD_PARITY_DEMOS=ON \
            -DFUSE_BUILD_VULKAN=ON

      - name: Build parity demos
        run: cmake --build build-u8-present --target demo_3d_empty demo_2d_sprites demo_hybrid_hud demo_fx demo_ai_bt demo_timeline demo_adventure_stub

      - name: Run U8 present ctests
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
        run: ctest --test-dir build-u8-present --no-tests=error -L '^u8$' -L '^present$' --output-on-failure -j1 --timeout 1200

  fuse-core-single-thread:
    name: fuse_core jobs (FUSE_JOBS_SINGLE_THREAD)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }}

      - name: Configure fuse_core single-thread profile
        run: |
          cmake -B build-st -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_JOBS_SINGLE_THREAD=ON
      - name: Build
        run: cmake --build build-st --config Release

      - name: Run single-thread CTest
        run: |
          ctest --test-dir build-st --no-tests=error --output-on-failure \
            -R 'fuse_core_jobs|fuse_core_jobs_single_thread|fuse_core_worker_count|fuse_core_fiber'

  fuse-warnings-as-errors:
    # Master plan: "CMake builds cleanly in Debug, Release, Profile, Shipping — zero warnings with
    # -Wall -Wextra" and "Shipping build compiles with zero warnings, zero debug code included —
    # verified by binary inspection". fuse-werror-* presets set FUSE_WARNINGS_AS_ERRORS=ON, which
    # applies -Wall -Wextra -Werror to every Source/FUSE + Tools/FUSE target (cmake/FuseWarnings.cmake;
    # vendored vendor/ subprojects excluded).
    name: FUSE -Werror (${{ matrix.config }})
    # Only needs the core build to have gone green, not ASan: -Werror reports while the (long) sanitizer run is still
    # going. Own concurrency group: in the shared host group it would queue beside fuse-smoke-asan, and GitHub cancels
    # a pending job when another one queues in the same group. max-parallel 1 keeps it to one leg at a time.
    needs: [fuse-core-linux]
    concurrency:
      group: fuse-umbrella-linux-werror-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        config: [debug, release, profile, shipping]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }} ${{ env.FUSE_APT_LINUX_VULKAN }}

      - name: Configure (fuse-werror-${{ matrix.config }})
        run: cmake --preset fuse-werror-${{ matrix.config }} -DCMAKE_CXX_COMPILER=g++-13

      - name: Build (warnings are errors)
        run: cmake --build build/fuse-werror-${{ matrix.config }}

      - name: Shipping binary inspection (no assert/profiler code or stripped strings)
        if: matrix.config == 'shipping'
        run: ctest --test-dir build/fuse-werror-shipping --no-tests=error --output-on-failure -R 'fuse_b7_shipping_binaries|fuse_core_b7_shipping_strip'

  fuse-smoke-asan:
    # Master plan: "ASan/UBSan clean on subsystem smoke" + "All unit tests pass
    # under ASan+UBSan". FUSE_SANITIZE instruments every Source/FUSE + Tools/FUSE
    # target (cmake/FuseSanitizers.cmake); UBSan is non-recoverable so any
    # finding fails its test. Third-party-only suppressions: cmake/sanitizers/.
    name: FUSE ASan+UBSan (all unit tests + smoke)
    needs: [fuse-core-linux]
    concurrency:
      group: fuse-umbrella-linux-host-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Debug ASan+UBSan build ~25 min; the full suite (~1400 tests) is ~2 h of test time serially on the 4-vCPU runner
    # (1004 tests took 94 min before the old 120-min limit cancelled the job), ~1 h with -j$(nproc). 240 leaves
    # headroom for slow runners without letting a hung job hold the host group for the 6 h default.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }} ${{ env.FUSE_APT_LINUX_VULKAN }}

      - name: Configure (fuse-asan preset, FUSE_SANITIZE=address,undefined)
        run: |
          cmake --preset fuse-asan \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DFUSE_BUILD_SMOKE=ON

      - name: Build
        run: cmake --build build/fuse-asan

      # Parallel: Lavapipe / display / audio / bench gates carry RUN_SERIAL (ctest runs those alone) and the Vulkan ICD
      # ones also take the run_vulkan_icd_locked.sh flock; the UI wall-clock budgets are NDEBUG-only, so in this Debug
      # build the rest are CPU-bound unit tests that can share the runner.
      - name: Run CTest under ASan+UBSan
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
          VK_ADD_LAYER_PATH: ${{ env.FUSE_LINUX_VK_LAYER_MANIFEST_DIR }}
        run: ctest --test-dir build/fuse-asan --no-tests=error --output-on-failure -j"$(nproc)" --timeout 2400

      - name: U8 parity demos + editor PIE embed (ASan+UBSan)
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
          VK_ADD_LAYER_PATH: ${{ env.FUSE_LINUX_VK_LAYER_MANIFEST_DIR }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:suppressions=${{ github.workspace }}/cmake/sanitizers/asan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp
        run: ctest --test-dir build/fuse-asan --no-tests=error -L u8 --output-on-failure -j1 --timeout 1200

      - name: Run fuse_runtime_smoke under ASan+UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:suppressions=${{ github.workspace }}/cmake/sanitizers/asan.supp
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp
        run: ./build/fuse-asan/Source/FUSE/Apps/RuntimeSmoke/fuse_runtime_smoke

  fuse-editor-ui:
    # FUSE UI editor gates (ctest label fuse_editor_ui): the fuse_editor_fuse shell under Xvfb + Lavapipe
    # (scene_viewport / gpu_viewport / live_present / present_adopt use Vulkan, 77 without a device). Release so
    # the 2 ms UI-frame and idle-spike budgets are enforced (they skip with 77 in Debug).
    name: FUSE UI editor gates (xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*; sudo apt-get update
          sudo apt-get install -y ${{ env.FUSE_APT_LINUX_BASE }} ${{ env.FUSE_APT_LINUX_VULKAN }} \
            ${{ env.FUSE_APT_LINUX_UI_EDITOR }}

      - name: Configure (Release, FUSE_BUILD_EDITOR=ON)
        run: |
          cmake -B build/editor-ui -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_BUILD_VULKAN=ON \
            -DFUSE_BUILD_EDITOR=ON
      - name: Build (editor shell + gate binaries + lint)
        # Whole tree: the fuse_editor_ui tests span several executables (fuse_editor_ui_gates, *_parity_gates,
        # *_panels2_gates, controller / panel-model tests, a11y gates) plus fuse_cook / demo players they launch.
        run: cmake --build build/editor-ui

      - name: Run FUSE UI editor gates under xvfb-run
        env:
          VK_ICD_FILENAMES: ${{ env.FUSE_LINUX_VK_ICD }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" \
            ctest --test-dir build/editor-ui -L fuse_editor_ui --output-on-failure --no-tests=error --timeout 2400

      - name: Editor lint (link closure / includes)
        run: ctest --test-dir build/editor-ui --no-tests=error -R "^fuse_lint_.*editor" --output-on-failure
