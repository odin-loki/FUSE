# FUSE fuse_core iOS simulator compile (stub workflow)
#
# GitHub-hosted Linux runners cannot build for iOS. Run this workflow on a macOS
# runner with Xcode installed, or locally:
#
#   cmake -B build-ios -G Xcode \
#     -DCMAKE_SYSTEM_NAME=iOS \
#     -DCMAKE_OSX_SYSROOT=iphonesimulator \
#     -DCMAKE_OSX_ARCHITECTURES=arm64 \
#     -DFUSE_BUILD_CORE=ON
#   cmake --build build-ios --target fuse_core
#
# See docs/unification/BUILD.md for full mobile notes.

name: FUSE fuse_core (iOS simulator)

on:
  workflow_dispatch:

jobs:
  fuse-core-ios:
    name: fuse_core iphonesimulator (manual / macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure fuse_core for iOS simulator
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=OFF
      - name: Build fuse_core stub
        run: cmake --build build-ios --config Release --target fuse_core

  # FUSE UI (Source/FUSE/UI standalone): fuse_text, fuse_ui_*, fuse_app + the Cocoa / UIKit window backends
  # (App/src/native_apple.mm). Compile-only: there is no display or simulator session on the runner.
  fuse-ui-macos:
    name: FUSE UI macOS (Cocoa + MoltenVK headers) compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and Vulkan (MoltenVK)
        run: brew install ninja molten-vk vulkan-headers vulkan-loader
      - name: Configure
        run: cmake -S Source/FUSE/UI -B build-ui-macos -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ui-macos
      # -LE perf: the wall-clock budget gates (fuse_ui_bench_10k, 1M-row frame budgets, icon rasterisation budget,
      # hello_startup) have thresholds for a quiet machine; a shared runner under -j 3 misses them by noise.
      - name: Headless UI gates
        run: ctest --test-dir build-ui-macos --no-tests=error --output-on-failure -j 3 -LE "vulkan|perf"

  # FUSE editor (Source/FUSE/EditorShell, FUSE UI shell) on Cocoa: the whole tree with the editor, then the
  # fuse_editor_ui gates. Hosted macOS runners have a logged-in GUI session (a window server), so the windowed gates
  # run on real NSWindows; MoltenVK through the Khronos loader is the Vulkan device (GPU gates skip with 77 inside
  # the test when no Vulkan device / presenter comes up).
  fuse-editor-macos:
    name: FUSE editor shell macOS (Cocoa) + fuse_editor_ui gates
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # No brew glslang: glslang 16.6 (brew) never finished one of the engine's GLSL twin shaders (run 43537460907:
      # the build sat 3 h on it). The editor needs none of the twins; FUSE UI's kernel comes from its SPIR-V fixture.
      - name: Install Ninja and Vulkan (MoltenVK)
        run: brew install ninja molten-vk vulkan-headers vulkan-loader
      - name: Configure (Release, editor shell)
        run: |
          cmake -B build-editor-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFUSE_BUILD_CORE=ON \
            -DFUSE_BUILD_CORE_TESTS=ON \
            -DFUSE_BUILD_VULKAN=ON \
            -DFUSE_BUILD_EDITOR=ON
      # The targets the fuse_editor_ui label runs (gate executables, the editor, fuse_cook they launch), not the
      # whole engine tree.
      - name: Build (editor shell + gate binaries)
        timeout-minutes: 150
        run: |
          cmake --build build-editor-macos -- -k 0 \
            fuse_editor_fuse_app fuse_editor_ui_gates fuse_editor_ui_parity_gates fuse_editor_ui_panels2_gates \
            fuse_editor_controller_tests fuse_editor_panel_models_tests fuse_cook fuse_lint
      - name: List editor gates
        if: always()
        run: ctest --test-dir build-editor-macos -L fuse_editor_ui -N
      - name: fuse_editor_ui gates
        run: |
          icd="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          if [ -f "$icd" ]; then export VK_ICD_FILENAMES="$icd"; fi
          echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-<loader default>}"
          ctest --test-dir build-editor-macos -L fuse_editor_ui --output-on-failure --no-tests=error --timeout 1200
      # ctest prints nothing for a skipped test: the GPU gates' skip reasons (77 = no Vulkan device / presenter)
      - name: GPU editor gates (verbose)
        if: always()
        run: |
          icd="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          if [ -f "$icd" ]; then export VK_ICD_FILENAMES="$icd"; fi
          ctest --test-dir build-editor-macos -R "fuse_editor_ui_(scene_viewport|gpu_viewport|live_present|present_adopt)$" -V --timeout 1200
      - name: Upload editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-ui-macos-shots
          path: build-editor-macos/editor_ui_shots
          if-no-files-found: ignore

  fuse-ui-ios:
    name: FUSE UI iOS simulator (UIKit) compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: |
          cmake -S Source/FUSE/UI -B build-ui-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ui-ios -- -k 0
